<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Mesa de Prazos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de trabalho — faixa de abas por promotoria, fila de expedientes ordenada por urgência, checklist do dia no topo. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E8EDF0; --ink:#15212B; --muted:#5A6875; --line:#D7DFE4;
  --accent:#22577A; --accent-soft:#E1ECF3; --accent-ink:#FFFFFF;
  --danger:#B42318; --danger-soft:#FDECEA; --warn:#A15C07; --warn-soft:#FDF1DC; --ok:#2B7A4B; --ok-soft:#E3F3E9; --info-soft:#EDF1F7;
  --c-gaeco:#3A4892; --c-caapora:#18756A; --c-guarabira:#93630F;
  --note:#FFF6DC; --note-line:#EBD49A; --note-ink:#4A3A10; --hero:#E6EEF2;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#162029; --sunk:#111A21; --ink:#E4EAEE; --muted:#93A2AE; --line:#263541;
  --accent:#7FB4D8; --accent-soft:#1B2F3D; --accent-ink:#0E151B;
  --danger:#F4877C; --danger-soft:#3A1B1A; --warn:#F2B24C; --warn-soft:#35270F; --ok:#73C995; --ok-soft:#14301F; --info-soft:#18232D;
  --c-gaeco:#9AA6EC; --c-caapora:#5FC9B9; --c-guarabira:#E1AE52; --note:#2A2414; --note-line:#4D4122; --note-ink:#F1DFAE; --hero:#13202A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#162029; --sunk:#111A21; --ink:#E4EAEE; --muted:#93A2AE; --line:#263541;
  --accent:#7FB4D8; --accent-soft:#1B2F3D; --accent-ink:#0E151B;
  --danger:#F4877C; --danger-soft:#3A1B1A; --warn:#F2B24C; --warn-soft:#35270F; --ok:#73C995; --ok-soft:#14301F; --info-soft:#18232D;
  --c-gaeco:#9AA6EC; --c-caapora:#5FC9B9; --c-guarabira:#E1AE52; --note:#2A2414; --note-line:#4D4122; --note-ink:#F1DFAE; --hero:#13202A; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.02rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top .sub{font-size:.92rem;color:var(--muted)}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.danger{background:var(--danger-soft);color:var(--danger)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{width:8px;height:8px;border-radius:50%}
.tab .n{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);padding:0 6px;border-radius:999px}
.dot.gaeco{background:var(--c-gaeco)} .dot.caapora{background:var(--c-caapora)} .dot.guarabira{background:var(--c-guarabira)}
section+section{margin-top:28px}
.sechead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ck h3{display:flex;align-items:center;gap:8px}
.ck ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.ck li label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.ck li label:hover{background:var(--sunk)}
.ck li input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.ck li.done span{text-decoration:line-through;color:var(--muted)}
.ck .step{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:1.4em}
.ck .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog .bar{flex:1;min-width:140px;height:8px}
.prog strong{font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.paste textarea{width:100%;min-height:120px;border:1px dashed var(--line);border-radius:6px;background:var(--sunk);padding:10px;font-family:var(--f-mono);font-size:.8rem;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.note{padding:10px 12px;border-radius:6px;background:var(--accent-soft);font-size:.88rem}
.note.warn{background:var(--warn-soft)}
.group{margin-top:18px}
.group>.gh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;border-left:4px solid var(--line)}
.item.u-vencido,.item.u-atrasado{border-left-color:var(--danger)} .item.u-hoje{border-left-color:var(--warn)} .item.u-amanha{border-left-color:var(--warn)} .item.u-semana{border-left-color:var(--accent)}
.item .l1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.item .proc{font-family:var(--f-mono);font-weight:500;font-size:.95rem}
.item .cls{font-weight:600}
.item .meta-line{font-size:.85rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:4px 12px;background:var(--sunk);border-radius:6px;padding:8px 10px}
.dates div{display:grid}
.dates b{font-family:var(--f-mono);font-weight:500;font-size:.9rem;font-variant-numeric:tabular-nums}
.dates .hl b{color:var(--accent)}
.dates .bad b{color:var(--danger)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-family:var(--f-mono);font-size:.78rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctrl input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:var(--surface);font-size:.86rem}
details.more summary{cursor:pointer;font-size:.82rem;color:var(--accent);font-weight:600}
details.more .in{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:8px}
details.more label{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
details.more input{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.pt{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pt.gaeco{color:var(--c-gaeco)} .pt.caapora{color:var(--c-caapora)} .pt.guarabira{color:var(--c-guarabira)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.9rem}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feito{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.feito .grow{flex:1;min-width:180px;font-size:.88rem}
.cfg{display:grid;gap:14px}
.cfg .f{display:grid;gap:4px}
.cfg select,.cfg input,.cfg textarea{border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--surface);max-width:100%}
.cfg textarea{min-height:70px;font-family:var(--f-mono);font-size:.82rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.status{font-size:.78rem;color:var(--muted)}
.res{margin-top:10px;display:grid;gap:6px}
.ign{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.84rem;padding:6px 10px;background:var(--sunk);border-radius:6px}
/* cabeçalho do dia */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center;background:var(--hero);border-radius:14px;padding:22px 22px 20px;margin-bottom:18px}
.hero h1{font-size:clamp(1.5rem,4vw,2.1rem)}
.hero .sum{margin-top:10px}
.dayboard{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .c b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500}
.ring .c span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.week{display:grid;gap:6px}
.week .bars{display:flex;gap:6px;align-items:flex-end;height:54px}
.week .bars div{display:grid;justify-items:center;gap:3px;font-size:.66rem;color:var(--muted)}
.week .bars i{display:block;width:16px;border-radius:4px 4px 2px 2px;background:var(--line);min-height:3px}
.week .bars .t i{background:var(--accent)}
.week .bars .t{color:var(--ink);font-weight:700}
.hint{font-size:.88rem;color:var(--ink);max-width:24ch}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
/* duas colunas na promotoria */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.layout aside{display:grid;gap:14px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.layout{grid-template-columns:1fr}.layout aside{position:static;order:-1}}
/* lembretes */
.notes{background:var(--note);border:1px solid var(--note-line);border-radius:var(--r);padding:14px;color:var(--note-ink)}
.notes h3{color:var(--note-ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.notes ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.notes li{background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:6px;padding:8px 10px;display:grid;gap:4px;border:1px solid transparent}
.notes li.pin{border-color:var(--note-line)}
.notes li p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-size:.9rem}
.notes .nm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.74rem;color:var(--muted)}
.notes .nm button{border:0;background:none;padding:0;color:var(--accent);font-size:.74rem;font-weight:600}
.notes .nm button.del-armed{color:var(--danger)}
.notes form{display:grid;gap:6px;margin-top:10px}
.notes textarea,.notes input{border:1px solid var(--note-line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font-size:.88rem;width:100%}
.notes textarea{min-height:64px;resize:vertical}
.pinstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pinstrip .notes li{background:none;padding:0}
.focus .item{box-shadow:0 1px 0 var(--line)}
.why{display:grid;gap:2px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);font-size:.9rem}
.why .lbl{color:inherit;opacity:.8}
.why-vencido,.why-atrasado{background:var(--danger-soft);color:var(--danger)} .why-vencido span+span,.why-atrasado span+span{color:var(--ink)}
.why-hoje,.why-amanha{background:var(--warn-soft);color:var(--warn)} .why-hoje span+span,.why-amanha span+span{color:var(--ink)}
.boxcard{text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:2px}
.boxcard:hover{border-color:var(--accent)}
.pinstrip.one{grid-template-columns:1fr}
/* jornada */
.jornada{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:grid;gap:12px}
.jh{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.jh .tot{font-family:var(--f-mono);font-size:1.05rem;font-weight:500}
.jh .bar{flex:1;min-width:120px;height:8px}
.timers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tmr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--bg)}
.tmr.on{border-color:var(--accent);background:var(--accent-soft)}
.tmr.out{border-color:var(--danger)}
.tmr .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tmr .clock{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.tmr.out .clock{color:var(--danger)}
.tmr .row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* situação do dia */
.situ{border-radius:12px;padding:14px 16px;margin-bottom:18px;display:grid;gap:10px;border:1px solid var(--line);background:var(--surface)}
.situ.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.situ.pend{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.situ.obs{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.situ .sh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.situ .big{font-family:var(--f-display);font-weight:650;font-size:1.2rem}
.situ.ok .big{color:var(--ok)} .situ.pend .big{color:var(--danger)} .situ.obs .big{color:var(--warn)}
.situ ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:.9rem}
.situ li{display:flex;gap:8px;align-items:baseline}
.situ li b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;min-width:6.5em}
.situ li.p b{color:var(--danger)} .situ li.o b{color:var(--warn)}
/* urgências */
.urg{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.urg h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.urg form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.urg form label{display:grid;gap:2px;font-size:.78rem;color:var(--muted)}
.urg form input,.urg form select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--ink);width:100%}
.urg form .wide{grid-column:1/-1}
.uck{display:grid;gap:4px;padding:8px 10px;background:var(--sunk);border-radius:6px;font-size:.86rem}
.uck label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.uck input{margin-top:3px;accent-color:var(--accent)}
.uck .done span{text-decoration:line-through;color:var(--muted)}
/* dicas */
.dicas{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dicas details{border-top:1px solid var(--line);padding:6px 0}
.dicas details:first-of-type{border-top:0}
.dicas summary{cursor:pointer;font-weight:600;font-size:.9rem}
.dicas ul{margin:6px 0 2px;padding-left:18px;display:grid;gap:6px;font-size:.86rem}
.dicas li b{color:var(--ink)}
.dicas .src{color:var(--muted);font-size:.76rem}
.dicas input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:var(--surface);margin:6px 0 4px;font-size:.86rem}
.dup{display:grid;gap:4px;padding:12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:700;margin-top:10px}
.dup span{color:var(--ink);font-weight:400;font-size:.88rem}
</style>

<body>

<div class="wrap">
  <header class="hero">
    <div>
      <div class="lbl">Mesa de Prazos · substituições MPPB</div>
      <h1 id="greet">Olá, José</h1>
      <div class="sub muted" id="hoje-txt"></div>
      <div class="sum" id="sum"></div>
    </div>
    <div class="dayboard" id="dayboard"></div>
  </header>
  <section class="situ" id="situ" aria-live="polite" aria-label="Situação do dia"></section>
  <section class="jornada" id="jornada" aria-label="Jornada de hoje"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <p class="status" id="status"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
/* Lógica pura da Mesa de Prazos — usada pela página e pelo script de carga. */
(function (root) {
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const fromBR = s => { const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(s || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
  const fromISO = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const br = d => d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : '—';
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const diffDays = (a, b) => Math.round((fromISO(iso(b)) - fromISO(iso(a))) / 864e5);

  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),

        <div class="row"><button class="btn pri" data-drive-connect>${D.token ? 'Sincronizar agora' : 'Conectar ao Google Drive'}</button>
          ${D.token ? '<button class="btn" data-drive-off>Desconectar</button>' : ''}
          <span class="small muted">${D.estado === 'ok' ? 'Conectado' + (D.ultimo ? ' · última cópia ' + new Date(D.ultimo).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '') : D.estado === 'erro' ? 'Erro: ' + esc(D.erro) : ''}</span></div>

    }
  };

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;

      const inp = document.getElementById('drive_client');

function motivo(i,u){
  const c = state.cfg.promotorias[i.prom]||{}; const d = s => brI(s)+' ('+dow(s)+')';
  const nU = s => { if(!s) return null; let n=0, x=today(); const alvo=s; while(P.iso(x)<alvo){ x=P.addDays(x,1); if(P.isBusiness(x,cfgCalc())) n++; } return n; };
  const out=[];
  if(i.tipo==='extra'){
    out.push(u.key==='vencido'||u.key==='atrasado' ? `O prazo legal de encerramento venceu em ${d(i.vencimento)}, ${rel(i.vencimento)}. Providenciar a prorrogação ou o encerramento.` : `O prazo legal de encerramento vence em ${d(i.vencimento)}, ${rel(i.vencimento)}.`);
  } else if(u.key==='vencido'){
    out.push(`O prazo final venceu em ${d(i.prazoFinal)}. Juntar imediatamente.`);
  } else {
    const pfU = nU(i.prazoFinal);
    let base='';
    if(c.meta==='ciencia' && !i.cienciaReal) base = `Em ${PROMS[i.prom].nome} a manifestação sai antes da ciência, que expira em ${d(i.limiteCiencia)}`;
    else if(c.meta==='aposCiencia') base = `Sua regra é juntar até o ${c.metaDias}º dia útil após a ciência (${brI(i.cienciaReal||i.limiteCiencia)}), ou seja, até ${d(i.meta)}`;
    else if(c.meta==='ciencia') base = `A ciência já foi registrada em ${brI(i.cienciaReal)}; a entrega é imediata`;
    else base = `A meta é ${c.metaDias} dia${c.metaDias>1?'s':''} út${c.metaDias>1?'eis':'il'} antes do prazo final`;
    const quando = u.key==='atrasado' ? `A meta passou ${rel(i.meta)}` : u.key==='hoje' ? 'A meta é hoje' : `A meta é ${d(i.meta)}`;
    out.push(`${quando}. ${base}. Prazo final: ${d(i.prazoFinal)}${pfU!=null?`, ${pfU===0?'hoje':pfU===1?'falta 1 dia útil':'faltam '+pfU+' dias úteis'}`:''}.`);
  }
  if((i.flags||[]).some(f=>/preso/i.test(f))) out.push('Réu preso: prioridade absoluta.');
  if(i.progresso && i.progresso<100) out.push(`Já está em ${i.progresso}%.`);
  return out.join(' ');
}

  return urgPanel() + '<div style="height:22px"></div>' + andamento + `<div class="layout" style="margin-top:28px"><div style="min-width:0"><div class="sechead"><h2>O que adiantar agora</h2><span class="small muted">Atrasados, de hoje e do próximo dia útil — com o porquê de cada um</span></div>${fila}</div>

function regraTxt(p){
  const c = state.cfg.promotorias[p];
  const cont = c.contagem==='uteis' ? 'dias úteis' : 'dias corridos, prorrogando para o próximo dia útil';
  const meta = c.meta==='aposCiencia' ? `meta de ${c.metaDias} dia${c.metaDias>1?'s':''} út${c.metaDias>1?'eis':'il'} após a ciência` : c.meta==='conclusao' ? `meta de ${c.metaDias} dia${c.metaDias>1?'s':''} út${c.metaDias>1?'eis':'il'} após a conclusão` : c.meta==='ciencia' ? '1 dia útil antes da data limite de ciência; se a ciência já expirou, entrega imediata' : `meta ${c.metaDias} dia${c.metaDias>1?'s':''} út${c.metaDias>1?'eis':'il'} antes do prazo final`;
  return `Quando o sistema informa a data limite de manifestação, ela é o prazo final; senão, conto em ${cont}, a partir do dia seguinte à ciência${c.dobro?' (em dobro)':''}. ${meta[0].toUpperCase()+meta.slice(1)}.`;
}

function grouped(list){
  const g = {}; list.forEach(i=>{ const u=urg(i); (g[u.key]=g[u.key]||{u,items:[]}).items.push(i); });
  return Object.values(g).sort((a,b)=>a.u.ord-b.u.ord).map(({u,items})=>`<div class="group"><div class="gh"><span class="chip ${URG_CHIP[u.key]}">${u.label}</span><span class="small muted">${items.length}</span></div><div class="list">${items.sort((a,b)=>(a.meta||'').localeCompare(b.meta||'')).map(i=>itemCard(i)).join('')}</div></div>`).join('');
}

    <div class="prog" style="margin-top:8px"><strong>${v}%</strong><div class="bar ${v===100&&all?'ok':''}"><i style="width:${v}%"></i></div></div></section>`;
  if(p==='guarabira'){
    const sub = state.sub.guarabira;
    const t30 = pend(p).filter(i=>i.tipo==='tram30'); const jud = pend(p).filter(i=>i.tipo!=='extra' && i.tipo!=='urgencia' && i.tipo!=='tram30'), ext = pend(p).filter(i=>i.tipo==='extra');

/* ---------- leitura das caixas ---------- */
function hashTxt(t){ const n=String(t||'').replace(/\s+/g,' ').trim(); let h=0x811c9dc5; for(let k=0;k<n.length;k++){ h^=n.charCodeAt(k); h=Math.imul(h,0x01000193); } return (h>>>0).toString(36)+'.'+n.length; }
function jaColado(chave, txt){
  const h=hashTxt(txt); const l=(state.cfg.colagens&&state.cfg.colagens[chave])||[]; const f=l.find(x=>x.h===h);
  return {h, quando: f ? f.em : null};
}
async function registrarColagem(chave, h){
  state.cfg.colagens = state.cfg.colagens||{}; const l=(state.cfg.colagens[chave]||[]).filter(x=>x.h!==h); l.unshift({h, em:Date.now()}); state.cfg.colagens[chave]=l.slice(0,40);
}
function avisoDup(quando){ return `<div class="dup" role="alert">Esse já foi copiado.<span>Este mesmo conteúdo foi colado em ${new Date(quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}. Nada foi alterado — nenhum item foi criado, atualizado ou marcado.</span></div>`; }

async function lerCaixa(p){
  const id = 'paste_'+p+'_judicial'; const txt = (document.getElementById(id)||{}).value||'';
  const dup = txt.trim() ? jaColado(p+'_judicial', txt) : {};
  if(dup.quando){ state.drafts[id] = avisoDup(dup.quando); document.getElementById(id).value=''; render(); toast('Esse já foi copiado — nada foi alterado'); return; }
  const lidos = P.parseCaixa(txt);
  if(!lidos.length){ state.drafts[id] = `<div class="note warn" style="margin-top:10px">Não encontrei nenhum "Expediente (número)" no texto. Copie a tabela inteira da caixa, incluindo as linhas de expediente.</div>`; render(); return; }
  const agora = Date.now(); let novos=0, atual=0; const ign=[]; const jaFeitos=[];
  for(const x of lidos){
    const ar = P.classificaArea(x); x.area = ar.area; x.areaMotivo = ar.motivo;
    if(p==='guarabira'){ const dg = P.digitoJudicial(x.numOrigem); const par = state.cfg.paridade==='par'; if(dg==null || (dg%2===0)!==par){ x._motivo='dígito '+(dg==null?'?':dg)+' antes do hífen'; ign.push(x); continue; } }
    if(p==='caapora' && state.cfg.promotorias.caapora.soCivel && ar.area==='penal'){ x._motivo='penal · '+ar.motivo; ign.push(x); continue; }
    if(p==='caapora' && filtroConclusorAtivo() && !norm(x.conclusor).includes(norm(state.cfg.promotorias.caapora.conclusor))){ x._motivo='concluso a '+(x.conclusor||'outro'); ign.push(x); continue; }
    const docId = 'j-'+p+'-'+x.expediente; const old = state.itens.get(docId);
    const base = Object.assign({}, x, {id:docId, prom:p, tipo:'judicial', prazoDiasOrig:x.prazoDias, vistoEm:agora});
    const it = old ? Object.assign({}, old, base, {prazoDiasOrig: old.prazoDiasEditado ? old.prazoDiasOrig : x.prazoDias, status:old.status, progresso:old.progresso, notas:old.notas, cienciaReal:x.cienciaReal||old.cienciaReal, metaManual:old.metaManual, feitoEm:old.feitoEm}) : Object.assign(base,{status:'pendente',progresso:0,notas:'',criadoEm:P.iso(today())});
    if(old && old.status==='feito'){ it.aindaNaCaixa = agora; jaFeitos.push(it); }
    calc(it); old ? atual++ : novos++; await store.putItem(it);
  }
  state.cfg.leituras[p+'_judicial'] = agora; await registrarColagem(p+'_judicial', dup.h); await store.putCfg();
  document.getElementById(id).value = '';
  const urgentes = lidos.map(x=>state.itens.get('j-'+p+'-'+x.expediente)).filter(i=>i && i.status!=='feito' && urg(i).ord<=3);
  state.drafts[id] = `<div class="res"><div class="note">Li <b>${lidos.length}</b> expediente${lidos.length>1?'s':''}: ${novos} novo${novos!==1?'s':''}, ${atual} atualizado${atual!==1?'s':''}${ign.length?`, ${ign.length} separado${ign.length>1?'s':''}`:''}. ${urgentes.length?`<b>${urgentes.length} para adiantar já:</b> ${urgentes.map(i=>esc(i.processo)+' (meta '+brI(i.meta)+')').join('; ')}.`:'Nenhum precisa ser adiantado até o próximo dia útil.'}</div>
    ${jaFeitos.length?`<div class="note warn"><b>Atenção:</b> ${jaFeitos.length} expediente${jaFeitos.length>1?'s':''} já marcado${jaFeitos.length>1?'s':''} como feito continua${jaFeitos.length>1?'m':''} na caixa: ${jaFeitos.map(i=>esc(i.processo)).join('; ')}. Continua${jaFeitos.length>1?'m':''} como feito${jaFeitos.length>1?'s':''} — se a minuta ainda não foi juntada, use "Reabrir" na aba Feitos.</div>`:''}
    ${ign.length?`<div class="lbl" style="margin-top:6px">${p==='caapora'?'Separados — penais (colega) ou conclusos a outra pessoa':'Fora da sua paridade'}</div>`:''}
    ${ign.map(x=>`<div class="ign" data-ign="${esc(x.expediente)}"><span class="mono">${esc(x.processo)}</span><span class="grow" style="flex:1;min-width:160px">${esc(x.classe)}<span class="muted"> · ${esc(x._motivo)}</span></span><span class="small muted">ciência ${brI(x.cienciaReal||x.limiteCiencia)}</span><button class="btn sm" data-incl='${esc(JSON.stringify(Object.assign({},x,{_p:p})))}'>Incluir para ajudar</button></div>`).join('')}</div>`;
  render(); toast(novos+atual ? 'Caixa lida e organizada' : 'Nada novo na caixa');
}
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim(); }
function filtroConclusorAtivo(){ const c=state.cfg.promotorias.caapora; return !!(c.conclusor && c.conclusorAte && P.iso(today())<=c.conclusorAte); }
async function incluir(x){
  const p=x._p||'guarabira'; delete x._p; delete x._motivo;
  const dk='paste_'+p+'_judicial'; if(state.drafts[dk]) state.drafts[dk]=state.drafts[dk].replace(new RegExp('<div class="ign" data-ign="'+x.expediente+'">[\\s\\S]*?</button></div>'),''); const docId='j-'+p+'-'+x.expediente;
  const it = Object.assign({}, x, {id:docId, prom:p, tipo:'judicial', prazoDiasOrig:x.prazoDias, vistoEm:Date.now(), status:'pendente', progresso:0, notas:'', criadoEm:P.iso(today())});
  calc(it); await store.putItem(it); render(); toast('Incluído na sua fila');
}
async function textoDoPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise; const pages=[];
  for(let n=1;n<=pdf.numPages;n++){ const pg = await pdf.getPage(n); const tc = await pg.getTextContent(); pages.push(tc.items.map(it=>({str:it.str, x:it.transform[4], y:it.transform[5]}))); }
  return P.agendaDePosicoes(pages);
}

async function lerTram30(p){
  const id='paste_'+p+'_tram30'; const ta=document.getElementById(id); const txt=(ta||{}).value||'';
  const dup = txt.trim() ? jaColado(p+'_tram30', txt) : {};
  if(dup.quando){ state.drafts[id]=avisoDup(dup.quando); ta.value=''; render(); toast('Esse já foi copiado — nada foi alterado'); return; }
  const RX=/\d{3}\.\d{4}\.\d{6}/g; const ms=[...txt.matchAll(RX)];
  if(!ms.length){ state.drafts[id]=`<div class="note warn" style="margin-top:10px">Não encontrei números de procedimento (000.0000.000000) no texto.</div>`; render(); return; }
  const vistos=new Map();
  ms.forEach((m,k)=>{ const num=m[0]; if(vistos.has(num)) return; const fim = k+1<ms.length ? ms[k+1].index : txt.length; const trecho = txt.slice(m.index+num.length, fim).replace(/\s+/g,' ').trim();
    const dt = /(\d{2}\/\d{2}\/\d{4})/.exec(trecho); const dd = /(\d+)\s*dias?/i.exec(trecho);
    vistos.set(num,{num, desc:trecho.replace(/\d{2}\/\d{2}\/\d{4}(\s+\d{2}:\d{2}(:\d{2})?)?/g,'').replace(/\s+/g,' ').trim().slice(0,160), desde: dt?P.iso(P.fromBR(dt[1])):null, dias: dd?+dd[1]:null}); });
  const par = state.cfg.paridade==='par'; const agora=Date.now(); let novos=0, atual=0, outros=0; const jaFeitos=[];
  for(const x of vistos.values()){
    if((P.ultimoDigito(x.num)%2===0)!==par){ outros++; continue; }
    const docId='t-'+x.num.replace(/\./g,'_'); const old=state.itens.get(docId);
    let dias = x.dias; if(dias==null && x.desde) dias = P.diffDays(P.fromISO(x.desde), today());
    const it=Object.assign({}, old||{status:'pendente',progresso:0,notas:'',criadoEm:P.iso(today())}, {id:docId, prom:p, tipo:'tram30', processo:x.num, classe:x.desc||'Tramitação há mais de 30 dias', desde:x.desde, dias, vistoEm:agora, flags:['Tramitação +30 dias']});
    if(old && old.status==='feito'){ it.aindaNaCaixa=agora; jaFeitos.push(it); }
    calc(it); old?atual++:novos++; await store.putItem(it);
  }
  state.cfg.leituras[p+'_tram30']=agora; await registrarColagem(p+'_tram30', dup.h); await store.putCfg();
  const sumiram = pend(p).filter(i=>i.tipo==='tram30' && i.vistoEm<agora);
  state.drafts[id]=`<div class="note" style="margin-top:10px">Li <b>${vistos.size}</b> procedimento${vistos.size>1?'s':''}: ${novos} novo${novos!==1?'s':''}, ${atual} atualizado${atual!==1?'s':''}${outros?`, ${outros} de final ${par?'ímpar':'par'} (Ana Paula) ignorado${outros>1?'s':''}`:''}.${sumiram.length?` <b>${sumiram.length} não ${sumiram.length>1?'estão':'está'} mais na lista</b> — se já ${sumiram.length>1?'foram tramitados':'foi tramitado'}, marque como feito.`:''}</div>
   ${jaFeitos.length?`<div class="note warn"><b>Atenção:</b> ${jaFeitos.map(i=>esc(i.processo)).join('; ')} já ${jaFeitos.length>1?'estavam':'estava'} como feito e continua${jaFeitos.length>1?'m':''} na lista. Continua${jaFeitos.length>1?'m':''} como feito — use "Reabrir" na aba Feitos se ainda não ${jaFeitos.length>1?'foram tramitados':'foi tramitado'}.</div>`:''}`;
  if(ta) ta.value=''; render(); toast('Lista lida');
}
async function lerAgenda(p){
  const id='paste_'+p+'_extra'; const fi=document.getElementById('pdf_'+p); let txt=(document.getElementById(id)||{}).value||'';
  try{ if(fi && fi.files && fi.files[0]){ if(!window.pdfjsLib) throw new Error('leitor de PDF não carregou'); txt = await textoDoPdf(fi.files[0]); } }
  catch(e){ state.drafts[id]=`<div class="note warn" style="margin-top:10px">Não consegui ler o PDF (${esc(e.message)}). Abra o PDF, copie todo o texto e cole na caixa.</div>`; render(); return; }
  const dupA = txt.trim() ? jaColado(p+'_extra', txt) : {};
  if(dupA.quando){ state.drafts[id] = avisoDup(dupA.quando); if(fi) fi.value=''; const ta0=document.getElementById(id); if(ta0) ta0.value=''; render(); toast('Esse já foi copiado — nada foi alterado'); return; }
  const todos = P.parseAgenda(txt); const meus = P.filtraAgenda(todos, state.cfg);
  if(!todos.length){ state.drafts[id]=`<div class="note warn" style="margin-top:10px">Não encontrei números de procedimento (000.0000.000000) no conteúdo.</div>`; render(); return; }
  const agora=Date.now(); let novos=0;
  for(const x of meus){
    const docId='x-'+x.processo.replace(/\./g,'_'); const old=state.itens.get(docId);
    const it = Object.assign({}, old||{status:'pendente',progresso:0,notas:'',criadoEm:P.iso(today())}, {id:docId, prom:p, tipo:'extra', processo:x.processo, interessados:x.interessados, distribuido:x.distribuido, inicio:x.inicio, vencimento:x.vencimento, vistoEm:agora});
    calc(it); if(!old) novos++; await store.putItem(it);
  }
  state.cfg.leituras[p+'_extra']=agora; await registrarColagem(p+'_extra', dupA.h); await store.putCfg();
  const f = k => meus.filter(i=>P.faixaExtra(i,today())===k).length;
  state.drafts[id] = `<div class="note" style="margin-top:10px">A agenda tem <b>${todos.length}</b> procedimentos; <b>${meus.length}</b> são seus (${novos} novos): ${f('vencidos')} vencidos, ${f('vincendos')} vincendos, ${f('mais30')} com mais de 30 dias.</div>`;
  if(fi) fi.value=''; const ta=document.getElementById(id); if(ta) ta.value='';
  render(); toast('Agenda lida');
}

  if(t.dataset.noteCopy){ const txt = notasDe(t.dataset.noteCopy).map(n=>'• '+n.texto+(n.origem?' ('+n.origem+')':'')).join('\n');
    try{ await navigator.clipboard.writeText(PROMS[t.dataset.noteCopy].nome+' — lembretes\n'+txt); toast('Lembretes copiados'); }catch(_){ toast('Não consegui copiar; selecione o texto manualmente'); } return; }
  if(t.hasAttribute('data-zerar')){ if(state.armed!=='zerar'){ state.armed='zerar'; render(); setTimeout(()=>{ if(state.armed==='zerar'){ state.armed=null; render(); } },5000); return; }
    state.armed=null; const ids=[...state.itens.keys()]; if(db){ for(const id of ids) await db.doc('itens/'+id).delete(); } state.itens.clear(); state.cfg.leituras={}; state.drafts={}; await store.putCfg(); if(!db) saveLocal(); render(); toast(ids.length+' expedientes apagados'); return; }
  if(t.dataset.timer){ await toggleTimer(t.dataset.timer); return; }
  if(t.hasAttribute('data-fechar-gaeco')){ await fecharGaeco(); return; }
  if(t.dataset.ck){ state.check[t.dataset.ck]=t.checked; render(); await store.putCheck(); return; }

  const upd = Object.assign({}, it);
  if(t.dataset.prog!=null){ upd.progresso=+t.dataset.prog; if(upd.progresso===100){ upd.status='feito'; upd.feitoEm=P.iso(today()); upd.feitoMs=Date.now(); } }
  else if(t.hasAttribute('data-done')){ upd.status='feito'; upd.progresso=100; upd.feitoEm=P.iso(today()); upd.feitoMs=Date.now(); }
  else if(t.hasAttribute('data-reopen')){ upd.status='pendente'; upd.progresso=75; delete upd.feitoEm; delete upd.feitoMs; delete upd.aindaNaCaixa; }
  else if(t.dataset.uck){ upd.ck = Object.assign({}, upd.ck||{}, {[t.dataset.uck]:t.checked}); }
  else if(t.hasAttribute('data-remove')){ await store.delItem(it.id); render(); toast('Removido'); return; }
  else return;
  await store.putItem(upd); render();
  if(upd.status==='feito' && it.status!=='feito'){ const m=metaDia(); toast(m.alvo && m.devidos===0 ? 'Meta do dia cumprida! 🎉' : m.devidos ? `Feito! Faltam ${m.devidos} para fechar o dia` : 'Feito e movido para Feitos'); }
});

  if(e.target.hasAttribute('data-urg-form')){ e.preventDefault(); await novaUrgencia(); return; }
  const f=e.target; if(!f.dataset.noteForm) return; e.preventDefault(); const p=f.dataset.noteForm;
  const tx=document.getElementById('nn_'+p), og=document.getElementById('no_'+p); const texto=(tx.value||'').trim(); if(!texto){ tx.focus(); return; }
  const n={id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), prom:p, texto, origem:(og.value||'').trim(), criadoEm:new Date().toISOString(), fixado:false};
  tx.value=''; og.value='';
  try{ await store.putNota(n); render(); toast('Lembrete salvo'); }catch(err){ tx.value=texto; toast('Não salvou ('+(err&&err.code||'erro')+'). Tente de novo.'); }
});

async function novaUrgencia(){
  const v = id => (document.getElementById(id)||{}).value||'';
  const tipo=v('u_tipo'), data=v('u_data'); if(!data){ toast('Informe a data'); return; }
  let meta = data;
  if(tipo==='relatorio'){ let m=P.addDays(P.fromISO(data),-4); const c=cfgCalc(); while(!P.isBusiness(m,c)) m=P.addDays(m,-1); meta=P.iso(m); if(meta<P.iso(today())) meta=P.iso(today()); }
  const it={id:'u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), tipo:'urgencia', urgTipo:tipo, prom:v('u_prom')||'gaeco', processo:v('u_proc').trim(), descricao:v('u_desc').trim(), hora:v('u_hora'), limiteManifestacao:data, metaManual:meta, status:'pendente', progresso:0, notas:'', criadoEm:P.iso(today()), ck:tipo==='relatorio'?{}:undefined};
  calc(it); await store.putItem(it); ['u_proc','u_desc','u_data','u_hora'].forEach(id=>{ const x=document.getElementById(id); if(x) x.value=''; }); render(); toast((URG_TIPOS[tipo]||'Urgência')+' adicionada — fazer até '+brI(it.meta));
}
document.addEventListener('input', e=>{
  const t=e.target; if(!t.dataset || !t.dataset.dq) return; const q=t.value.toLowerCase().trim(); const box=t.closest('.dicas');
  box.querySelectorAll('[data-dsec]').forEach(d=>{ let n=0; d.querySelectorAll('li').forEach(li=>{ const ok=!q||li.dataset.dtxt.includes(q); li.hidden=!ok; if(ok) n++; }); d.hidden = !!q && !n; if(q) d.open = n>0; });
});
const notaTimers={};
document.addEventListener('input', e=>{
  const t=e.target; if(!t.hasAttribute('data-nota')) return; const id=t.closest('[data-id]').dataset.id;
  clearTimeout(notaTimers[id]); notaTimers[id]=setTimeout(async()=>{ const it=state.itens.get(id); if(!it||it.notas===t.value) return; await store.putItem(Object.assign({},it,{notas:t.value})); },700);
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.f){ const id=t.closest('[data-id]').dataset.id; const it=Object.assign({},state.itens.get(id)); if(t.dataset.f==='prazoDiasOrig'){ it.prazoDiasOrig = t.value?+t.value:null; it.prazoDiasEditado=true; } else it[t.dataset.f]=t.value||null; calc(it); await store.putItem(it); render(); return; }
  if(t.dataset.cfg){ const path=t.dataset.cfg.split('.'); const val = t.type==='checkbox'?t.checked:(t.type==='number'?+t.value:t.value);
    if(path.length===2) state.cfg.promotorias[path[0]][path[1]]=val; else state.cfg[path[0]]=val; await recalcAll(); return; }
  if(t.dataset.cfgp){ const [a,b]=t.dataset.cfgp.split('.'); state.cfg.promotorias[a][b]=t.value.trim(); await store.putCfg(); render(); toast('Ajuste salvo'); return; }
  if(t.dataset.cfgtxt){ const k=t.dataset.cfgtxt; state.cfg[k] = k==='feriadosExtras' ? t.value.split(/[,;\s]+/).filter(s=>/\d{2}\/\d{2}\/\d{4}/.test(s)) : t.value.trim(); await recalcAll(); }
});
async function recalcAll(){
  await store.putCfg();
  for(const it of [...state.itens.values()]){ if(it.status==='feito') continue; const before=it.meta+'|'+it.prazoFinal; const c=Object.assign({},it); calc(c); if(c.meta+'|'+c.prazoFinal!==before) await store.putItem(c); }
  render(); toast('Ajuste salvo e prazos recalculados');
}
boot();
})();
</script>
